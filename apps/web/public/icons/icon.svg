<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2238" />
      <stop offset="100%" stop-color="#080C14" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <g transform="translate(256, 256) scale(1.1)">
    <!-- Shield Outline -->
    <path d="M 0 -130 Q 110 -130 130 -80 Q 130 30 0 140 Q -130 30 -130 -80 Q -110 -130 0 -130 Z" 
          fill="#0D1527" stroke="url(#shieldGrad)" stroke-width="14" filter="url(#glow)"/>
    <!-- Central ARGUS Eye Diamond -->
    <polygon points="0,-48 48,0 0,48 -48,0" fill="#10B981" stroke="#34D399" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#A7F3D0" />
    <circle cx="0" cy="0" r="7" fill="#080C14" />
  </g>
</svg>