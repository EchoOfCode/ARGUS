version: "3.8"

services:
  argus-brain:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../apps/brain:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  argus-bridge:
    volumes:
      - ../apps/bridge:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
