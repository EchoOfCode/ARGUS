name: Bug Report
description: Create a report to help us improve ARGUS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Note:** If you are reporting a security vulnerability, please do NOT use this form.
        Refer to [SECURITY.md](../SECURITY.md) to report security issues privately.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide reproduction steps. Do NOT include real phone numbers, real API keys, or private chat contents.
      placeholder: |
        1. Set configuration ...
        2. Send message ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Terminal Output
      description: Paste relevant logs. Redact any tokens or phone numbers!
      render: shell
