version: 2
updates:
  # Python Brain dependencies
  - package-ecosystem: "pip"
    directory: "/apps/brain"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Node Bridge dependencies
  - package-ecosystem: "npm"
    directory: "/apps/bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/apps/brain"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/bridge"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
